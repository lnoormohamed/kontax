<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Kontax — Offline</title>
  <!-- P42-DB01 Surface 4: SW cold-start fallback, aligned to the in-app
       connection banner ("You're offline", wifi-off icon, calm factual tone).
       Stays self-contained: inline styles, system font stack, no imports. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f4;
      color: #1d2823;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      text-align: center;
    }
    .icon {
      width: 66px;
      height: 66px;
      border-radius: 17px;
      background: #17352e;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 22px;
    }
    .icon.online { background: #1f8a5b; }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.015em;
      margin: 0 0 8px;
    }
    p {
      font-size: 14.5px;
      color: #5c655e;
      line-height: 1.55;
      max-width: 330px;
      margin: 0 auto 26px;
    }
    button {
      height: 46px;
      padding: 0 26px;
      border-radius: 12px;
      background: #17352e;
      color: #fff;
      font-size: 14.5px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    button:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .status {
      margin-top: 18px;
      font-size: 13px;
      color: #8a928c;
      min-height: 18px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c89b3c;
      margin-right: 7px;
      vertical-align: middle;
    }
    .dot.online { background: #2f9e6e; }
  </style>
</head>
<body>
  <div class="icon" id="icon">
    <svg id="iconOffline" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.5C5 6 8.5 4.6 12 4.6"/>
      <path d="M5.5 12c1.3-1 2.9-1.6 4.5-1.8"/>
      <path d="M9 15.5c.9-.5 2-.8 3-.8"/>
      <path d="M12 19h.01"/>
      <path d="M2 2l20 20"/>
    </svg>
    <svg id="iconOnline" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M5 12.5l4 4 10-10"/>
    </svg>
  </div>
  <h1 id="title">You&rsquo;re offline</h1>
  <p id="body">Kontax needs a connection to open. Your synced contacts are safe &mdash; we&rsquo;ll pick up where you left off as soon as you&rsquo;re back online.</p>
  <button id="retry" onclick="window.location.reload()">Try again</button>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">No connection</span></div>

  <script>
    var retry = document.getElementById("retry");
    var dot = document.getElementById("dot");
    var statusText = document.getElementById("statusText");
    var icon = document.getElementById("icon");
    var iconOffline = document.getElementById("iconOffline");
    var iconOnline = document.getElementById("iconOnline");
    var title = document.getElementById("title");
    var body = document.getElementById("body");

    function render() {
      if (navigator.onLine) {
        dot.classList.add("online");
        icon.classList.add("online");
        iconOffline.style.display = "none";
        iconOnline.style.display = "";
        title.textContent = "Back online";
        body.textContent = "Connection restored. Taking you back to Kontax…";
        statusText.textContent = "Back online — reconnecting…";
        retry.disabled = true;
        // Give the network a beat to settle, then return to the app.
        setTimeout(function () { window.location.reload(); }, 600);
      } else {
        dot.classList.remove("online");
        icon.classList.remove("online");
        iconOffline.style.display = "";
        iconOnline.style.display = "none";
        title.textContent = "You’re offline";
        body.textContent = "Kontax needs a connection to open. Your synced contacts are safe — we’ll pick up where you left off as soon as you’re back online.";
        statusText.textContent = "No connection";
        retry.disabled = false;
      }
    }

    window.addEventListener("online", render);
    window.addEventListener("offline", render);
    render();
  </script>
</body>
</html>
